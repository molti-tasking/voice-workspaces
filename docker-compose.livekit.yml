# Self-hosted LiveKit for local development.
#
#     docker compose -f docker-compose.yml -f docker-compose.livekit.yml up -d
#
# LiveKit is a single Go binary and needs no database. It is a media server:
# audio flows browser <-> LiveKit <-> agent over WebRTC, which is what gives
# real echo cancellation, jitter buffering and packet loss recovery — the things
# the hand-rolled WebSocket path had to fake and got wrong.
#
# `--dev` uses the well-known devkey/secret below. That is FINE locally and
# unacceptable anywhere else; production sets LIVEKIT_API_KEY / _SECRET.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      # Signalling.
      - "7880:7880"
      # WebRTC media over TCP, the fallback when UDP is blocked.
      - "7881:7881"
      # WebRTC media over UDP, which is the path that actually gets used.
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped
