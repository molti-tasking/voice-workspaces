# Local development.
#
# Only Postgres runs in Docker; web and worker run via `pnpm dev` so you get
# hot reload. pg-boss lives in the same database (schema: pgboss), so there is
# no Redis and nothing else to start.
services:
  postgres:
    # pgvector is unused today, but installing the extension now means adding
    # retrieval over transcripts later needs no migration dance.
    #
    # Keep this major version in step with the Coolify database resource in
    # production (PGVector 17) — matching majors keeps pg_dump/restore of the
    # study data between prod and a laptop a non-event.
    image: pgvector/pgvector:pg17
    container_name: voicemural-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicemural
      POSTGRES_PASSWORD: voicemural
      POSTGRES_DB: voicemural
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No initdb hook: extensions and the pgboss schema are applied by
    # `pnpm db:migrate` (packages/db/src/init-db.ts), which is the same path
    # production uses. An initdb mount would only fire on first cluster
    # creation, so dev and prod would diverge on exactly the setup step that is
    # hardest to notice is missing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicemural -d voicemural"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
