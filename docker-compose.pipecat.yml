# Pipecat, alongside LiveKit, so the two can be compared on the same voice.
#
#     docker compose -f docker-compose.yml -f docker-compose.livekit.yml \
#                    -f docker-compose.pipecat.yml up -d
#
# Then switch between them with NEXT_PUBLIC_TALKBACK_BACKEND=livekit|pipecat.
#
# Unlike LiveKit this needs no media server: SmallWebRTC is peer-to-peer between
# the browser and this container, which is fine for one driver at a time.
services:
  pipecat:
    build:
      context: .
      dockerfile: apps/pipecat/Dockerfile
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MODEL_TRANSCRIBE=${MODEL_TRANSCRIBE}
      - MODEL_TRANSCRIBE_LIVE=${MODEL_TRANSCRIBE_LIVE:-}
      - MODEL_CONVERSE=${MODEL_CONVERSE}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      # Must stay a streaming-capable model. eleven_v3 is HTTP-only and 403s on
      # the websocket, which would make Pipecat sound chopped for a reason that
      # has nothing to do with Pipecat.
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_turbo_v2_5}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - PIPECAT_PORT=7860
      # Retrieval lives in the Next app: `/api/realtime/context` runs the same
      # buildContextMessage the LiveKit agent calls in process. Inside a
      # container `localhost` is this container, so reach the host explicitly.
      - WEB_URL=${WEB_URL:-http://host.docker.internal:3000}
    ports:
      - "7860:7860"
    # Peer-to-peer WebRTC needs the host's network path for ICE to work without
    # a TURN server. On Linux this is what makes local media connect at all.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:7860/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
