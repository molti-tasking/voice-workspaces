# Coolify deployment.
#
# Add this repo as a Docker Compose resource in Coolify, set the compose file to
# `docker-compose.prod.yml`, connect via the GitHub App, and every push to main
# redeploys. Traefik terminates TLS and supplies the public HTTPS domain —
# which the recorder needs anyway, since getUserMedia requires a secure context.
#
# POSTGRES IS NOT HERE ON PURPOSE. It is a separate Coolify database resource
# (PGVector 17), because Coolify's scheduled backups only cover managed database
# resources — not a Postgres container buried in a compose file. The database is
# the study's measurement apparatus and the growth curve cannot be rebuilt after
# the fact, so an unbacked-up volume is the biggest risk in this deployment.
#
# Two things this requires in Coolify:
#   1. Enable "Connect To Predefined Network" on this resource, so these
#      services share a network with the database and can resolve it by its
#      internal hostname.
#   2. Set DATABASE_URL to the database's *internal* connection URL.
services:
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    # Applies sql/init.sql (extensions, pgboss schema) and then the migrations.
    # Must land before web or worker start, or the first request after a schema
    # change hits missing columns.
    command: ["pnpm", "--filter", "@voicemural/db", "migrate"]
    # There is no `depends_on: postgres` to gate on any more, so retry instead:
    # the managed database is normally already up, but a redeploy that races it
    # should recover on its own. Bounded, so a genuinely broken migration fails
    # the deploy instead of looping forever.
    restart: on-failure:5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_ vars are inlined into the client bundle at build time, so
      # they must be passed as build args, not just container environment.
      args:
        - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
        # Prerendered pages bake their absolute URLs (canonical, og:image) at
        # build time. Also passed as runtime environment below, for auth.
        - BETTER_AUTH_URL=${BETTER_AUTH_URL}
    environment:
      # Declared so Coolify wires Traefik to this service on port 3000.
      - SERVICE_FQDN_WEB_3000
      - DATABASE_URL=${DATABASE_URL}
      # Set this explicitly to the public origin — e.g. https://voice.example.com
      # — with NO port and no trailing slash.
      #
      # Deliberately not derived from SERVICE_FQDN_WEB_3000: Coolify renders that
      # with the container port appended (`https://host:3000`), and Better Auth
      # builds the OAuth callback and validates request origins from this value.
      # A port here that browsers do not use breaks sign-in with an origin
      # mismatch, which looks like a GitHub misconfiguration rather than ours.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Each provider is independent: configure either, both, or neither. With
      # none set the app is guest-only, which is what preview environments run
      # as — neither GitHub nor Google accepts a wildcard callback URL.
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MODEL_TRANSCRIBE=${MODEL_TRANSCRIBE}
      - MODEL_FAST=${MODEL_FAST}
      - MODEL_REASONING=${MODEL_REASONING}
      - STORAGE_DIR=/data/storage
      # Also needed at runtime, not just as a build arg: the server-side client
      # in the route handlers and Better Auth hooks reads them per process.
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
    volumes:
      - audio-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MODEL_TRANSCRIBE=${MODEL_TRANSCRIBE}
      - MODEL_FAST=${MODEL_FAST}
      - MODEL_REASONING=${MODEL_REASONING}
      # Audio is transient by default: a chunk is deleted once its transcript is
      # committed. Set to true BEFORE changing CHUNK_MS or MODEL_TRANSCRIBE —
      # once audio is gone the corpus cannot be re-derived.
      - KEEP_AUDIO=${KEEP_AUDIO:-false}
      - STORAGE_DIR=/data/storage
      # The worker is where $ai_generation and capture_session_completed come
      # from, so it needs its own PostHog credentials.
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
      - POSTHOG_CAPTURE_AI_CONTENT=${POSTHOG_CAPTURE_AI_CONTENT:-true}
      - WORKSPACE_BATCH_SIZE=${WORKSPACE_BATCH_SIZE:-8}
    volumes:
      # Same volume as web: the web app writes chunks, the worker reads them.
      # Both images run as uid 1001, which is what makes the shared mount work.
      - audio-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  audio-data:
