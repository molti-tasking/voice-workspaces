# Coolify deployment.
#
# Add this repo as a Docker Compose resource in Coolify, set the compose file to
# `docker-compose.prod.yml`, connect via the GitHub App, and every push to main
# redeploys. Traefik terminates TLS and supplies the public HTTPS domain —
# which the recorder needs anyway, since getUserMedia requires a secure context.
#
# POSTGRES IS NOT HERE ON PURPOSE. It is a separate Coolify database resource
# (PGVector 17), because Coolify's scheduled backups only cover managed database
# resources — not a Postgres container buried in a compose file. The database is
# the study's measurement apparatus and the growth curve cannot be rebuilt after
# the fact, so an unbacked-up volume is the biggest risk in this deployment.
#
# Two things this requires in Coolify:
#   1. Enable "Connect To Predefined Network" on this resource, so these
#      services share a network with the database and can resolve it by its
#      internal hostname.
#   2. Set DATABASE_URL to the database's *internal* connection URL.
services:
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    # Applies sql/init.sql (extensions, pgboss schema) and then the migrations.
    # Must land before web or worker start, or the first request after a schema
    # change hits missing columns.
    command: ["pnpm", "--filter", "@voicemural/db", "migrate"]
    # There is no `depends_on: postgres` to gate on any more, so retry instead:
    # the managed database is normally already up, but a redeploy that races it
    # should recover on its own. Bounded, so a genuinely broken migration fails
    # the deploy instead of looping forever.
    restart: on-failure:5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_ vars are inlined into the client bundle at build time, so
      # they must be passed as build args, not just container environment.
      args:
        - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
        # PostHog's Next.js config uploads source maps during this image build.
        - POSTHOG_API_KEY=${POSTHOG_API_KEY}
        - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID}
        - POSTHOG_HOST=${POSTHOG_HOST}
        # Prerendered pages bake their absolute URLs (canonical, og:image) at
        # build time. Also passed as runtime environment below, for auth.
        - BETTER_AUTH_URL=${BETTER_AUTH_URL}
        # Decides whether the conversational path is built into the bundle at all.
        - NEXT_PUBLIC_TALKBACK_ENABLED=${TALKBACK_ENABLED:-false}
        - NEXT_PUBLIC_PIPECAT_URL=${NEXT_PUBLIC_PIPECAT_URL:-}
        # The BROWSER's STUN. Without it the browser offers only LAN
        # candidates and ICE never completes against a remote container.
        - NEXT_PUBLIC_ICE_SERVERS=${NEXT_PUBLIC_ICE_SERVERS:-stun:stun.l.google.com:19302}
    environment:
      # Declared so Coolify wires Traefik to this service on port 3000.
      - SERVICE_FQDN_WEB_3000
      - DATABASE_URL=${DATABASE_URL}
      # Set this explicitly to the public origin — e.g. https://voice.example.com
      # — with NO port and no trailing slash.
      #
      # Deliberately not derived from SERVICE_FQDN_WEB_3000: Coolify renders that
      # with the container port appended (`https://host:3000`), and Better Auth
      # builds the OAuth callback and validates request origins from this value.
      # A port here that browsers do not use breaks sign-in with an origin
      # mismatch, which looks like a GitHub misconfiguration rather than ours.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Each provider is independent: configure either, both, or neither. With
      # none set the app is guest-only, which is what preview environments run
      # as — neither GitHub nor Google accepts a wildcard callback URL.
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MODEL_TRANSCRIBE=${MODEL_TRANSCRIBE}
      - MODEL_FAST=${MODEL_FAST}
      - MODEL_REASONING=${MODEL_REASONING}
      # The memory index. Optional — unset keeps recall lexical. Web embeds the
      # query per turn; the worker builds the index. See TALKBACK.md, "Memory".
      - MODEL_EMBED=${MODEL_EMBED:-}
      # Talk-back's web search. Optional — unset, the agent is not offered it.
      # See TALKBACK.md, "Web search".
      - SEARXNG_URL=${SEARXNG_URL:-}
      - STORAGE_DIR=/data/storage
      # Also needed at runtime, not just as a build arg: the server-side client
      # in the route handlers and Better Auth hooks reads them per process.
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
      # How the BROWSER finds a path for the audio, served per connection by
      # /api/realtime/ice. RUNTIME, not a build arg, and that is the point: the
      # relay half is a credential, so it cannot be inlined into a bundle
      # anyone can read — and ICE can now be repointed with a restart instead
      # of a rebuild. The build arg above remains the fallback.
      - ICE_SERVERS=${ICE_SERVERS:-stun:stun.l.google.com:19302}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_TTL_SECONDS=${TURN_TTL_SECONDS:-43200}
    volumes:
      - audio-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MODEL_TRANSCRIBE=${MODEL_TRANSCRIBE}
      - MODEL_FAST=${MODEL_FAST}
      - MODEL_REASONING=${MODEL_REASONING}
      # The memory index. Optional — unset keeps recall lexical. Web embeds the
      # query per turn; the worker builds the index. See TALKBACK.md, "Memory".
      - MODEL_EMBED=${MODEL_EMBED:-}
      # Audio is transient by default: a chunk is deleted once its transcript is
      # committed. Set to true BEFORE changing CHUNK_MS or MODEL_TRANSCRIBE —
      # once audio is gone the corpus cannot be re-derived.
      - KEEP_AUDIO=${KEEP_AUDIO:-false}
      # How many chunks the worker transcribes in parallel — really a limit on
      # how hard it leans on the LiteLLM proxy. .env.example documents
      # lowering this to 1 when the live conversation's ASR is contending.
      - TRANSCRIBE_CONCURRENCY=${TRANSCRIBE_CONCURRENCY:-}
      - STORAGE_DIR=/data/storage
      # The worker is where $ai_generation and capture_session_completed come
      # from, so it needs its own PostHog credentials.
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
      - POSTHOG_CAPTURE_AI_CONTENT=${POSTHOG_CAPTURE_AI_CONTENT:-true}
      - WORKSPACE_BATCH_SIZE=${WORKSPACE_BATCH_SIZE:-8}
    volumes:
      # Same volume as web: the web app writes chunks, the worker reads them.
      # Both images run as uid 1001, which is what makes the shared mount work.
      - audio-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Talk-back: the live conversation socket. Optional — leave TALKBACK_ENABLED
  # unset and this service refuses upgrades while everything else is unaffected.
  #
  # The voice service. Separate from `web` on purpose: the web container holds
  # the chunk upload route, the one path in this system that cannot fail, and
  # long-lived duplex sessions plus PCM buffers have no business in that event
  # loop. This container can leak, stall or be redeployed without touching
  # capture — which is the acceptance criterion for the whole feature.
  #
  # REPLACED the old `realtime` service, which built `apps/realtime/Dockerfile`.
  # That directory was deleted when talk-back moved to a framework and this file
  # was never updated, so production talk-back had been un-deployable — the
  # compose file referenced a Dockerfile that did not exist.
  pipecat:
    build:
      context: .
      dockerfile: apps/pipecat/Dockerfile
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MODEL_TRANSCRIBE=${MODEL_TRANSCRIBE}
      # The live path's own ASR deployment. Falls back to MODEL_TRANSCRIBE,
      # which works but queues behind the worker's batched jobs.
      - MODEL_TRANSCRIBE_LIVE=${MODEL_TRANSCRIBE_LIVE:-}
      - MODEL_CONVERSE=${MODEL_CONVERSE}
      # Folds the drive into a rolling summary. Falls back to MODEL_CONVERSE,
      # deliberately not to MODEL_FAST — see packages/llm/src/config.ts.
      - MODEL_SUMMARISE=${MODEL_SUMMARISE:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      # The FALLBACK voice. Per-session voices come from /api/realtime/session
      # (packages/talkback/src/voice.ts); this is used when a session has none.
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      # Must stay a streaming-capable model. eleven_v3 is HTTP-only and 403s on
      # the websocket, which would make every reply sound chopped.
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_turbo_v2_5}
      # CORS origin for the browser's /offer request.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      # From .env so NEXT_PUBLIC_PIPECAT_URL and this stay in step — they must
      # match or the browser offers to a port nothing listens on.
      - PIPECAT_PORT=${PIPECAT_PORT:-7860}
      # Retrieval, the prompt and the summary seed all live in the Next app.
      # The INTERNAL service name, not host.docker.internal: that is a
      # developer-machine escape hatch and resolves to nothing here.
      - WEB_URL=http://web:3000
      # Only signalling goes through Traefik; the media is peer-to-peer, so
      # behind NAT this container needs STUN to discover its public mapping.
      # Without it ICE never completes and calls time out looking like a
      # network fault. STUN ONLY — the relay is the two variables below.
      - ICE_SERVERS=${ICE_SERVERS:-stun:stun.l.google.com:19302}
      # The relay, and the reason talk-back works from a phone. STUN is enough
      # only while one side can be hole-punched; a mobile carrier's NAT is
      # symmetric, so neither can, and the call times out in silence. Must be
      # the same secret coturn holds — see the `coturn` service below.
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_TTL_SECONDS=${TURN_TTL_SECONDS:-43200}
      # Prompt observability. Unset (the default) and none of this runs — no
      # exporter, no spans, no dependency on Langfuse being up. See
      # `setup_langfuse_tracing` in apps/pipecat/bot.py.
      #
      # Worth a decision before setting it in production: the spans carry the
      # composed prompt and the recalled passages, which are participant speech.
      # Pointing this at Langfuse Cloud sends that off AU infrastructure — the
      # same ethics line as STT_PROVIDER, and self-hosting Langfuse is how it is
      # avoided.
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # Live transcription. Default keeps audio at AU; deepgram/assemblyai do
      # not — see .env.example. Speaker labels need one of the hosted providers.
      - STT_PROVIDER=${STT_PROVIDER:-litellm}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-3}
      - DEEPGRAM_UTTERANCE_END_MS=${DEEPGRAM_UTTERANCE_END_MS:-1000}
      # Pipecat ends a turn after this much silence if its turn model has not.
      - USER_TURN_STOP_TIMEOUT_SECS=${USER_TURN_STOP_TIMEOUT_SECS:-2.0}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      # Fallback live-path language when a session states none (per-drive
      # choices arrive via /api/realtime/session). Unset = auto-detect.
      - STT_LANGUAGE=${STT_LANGUAGE:-}
      - STT_DIARIZE=${STT_DIARIZE:-true}
      # The proactive engine: unprompted turns out of silence. Unset = on.
      - PROACTIVE_OFFERS=${PROACTIVE_OFFERS:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No audio volume, deliberately. Live audio lives in memory for the length
    # of one utterance and is then discarded — not giving this container
    # anywhere to write audio is what keeps that true rather than aspirational.
    #
    # Let an in-flight turn settle on redeploy instead of cutting it mid-sentence.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:7860/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      # Signalling only. Routed on the SAME public origin as web, under
      # /pipecat, so the browser's request is same-origin.
      #
      # ⚠️ MEDIA DOES NOT GO THROUGH TRAEFIK. SmallWebRTC is peer-to-peer: only
      # the SDP exchange below is HTTP. The audio itself needs a UDP path
      # between the browser and this container, and Traefik has nothing to do
      # with finding one — so a talk-back fault is almost never a routing fault.
      #
      # That path comes from ICE: STUN for the direct case, and the `coturn`
      # service below for the case STUN cannot reach, which is every phone on
      # mobile data. Confirmed broken from a Telekom mobile connection on
      # 18 Sep 2026 with STUN alone; see the note on `coturn`.
      - traefik.enable=true
      - traefik.http.routers.vm-pc.rule=Host(`${REALTIME_HOST}`) && PathPrefix(`/pipecat`)
      - traefik.http.routers.vm-pc.entrypoints=https
      - traefik.http.routers.vm-pc.tls=true
      # Ahead of web's router, which would otherwise match /pipecat on the host.
      - traefik.http.routers.vm-pc.priority=100
      # Strips /pipecat so the container sees POST /offer and PATCH /offer.
      # The PATCH route is NOT optional — without it the browser's trickle-ICE
      # candidates 405 and the peer connection never leaves `connecting`.
      - traefik.http.middlewares.vm-pc-strip.stripprefix.prefixes=/pipecat
      - traefik.http.routers.vm-pc.middlewares=vm-pc-strip
      - traefik.http.services.vm-pc.loadbalancer.server.port=7860

  # ---------------------------------------------------------------------------
  # coturn — the relay that makes talk-back work away from a desk
  # ---------------------------------------------------------------------------
  #
  # WHY THIS EXISTS. Only signalling goes through Traefik; the audio is
  # peer-to-peer. STUN is enough to find a direct path whenever at least one end
  # can be hole-punched, which covers a laptop on home Wi-Fi — and covered every
  # test this project ran for months. It is NOT enough from a phone on mobile
  # data: carriers run carrier-grade NAT, which is typically symmetric, so the
  # mapping the phone learns from STUN is not the mapping the container sends
  # to. No candidate pair forms and the call sits in `checking` until it times
  # out about a minute later.
  #
  # Nothing in that failure names NAT. The bot composes its opening line,
  # ElevenLabs synthesises it, and it is spoken into a transport with nowhere to
  # send it, while the phone still uploads chunks over HTTPS and fills the
  # transcript on screen — so the drive looks recorded and merely mute. That is
  # a drive on 18 Sep 2026, and it is what this service fixes. There is no STUN
  # configuration that reaches a symmetric NAT; a relay is the only answer.
  #
  # HOST NETWORKING, deliberately. coturn hands out the address it believes it
  # has, so inside a bridge it would advertise a 172.x relay no browser can
  # reach. On the host it sees the real one and needs no --external-ip.
  #
  # If Coolify refuses host networking on this resource, the alternative is to
  # delete `network_mode: host`, publish the ports, and tell coturn its public
  # address — all three, or the relay it advertises will be wrong:
  #
  #   ports:
  #     - "3478:3478/udp"
  #     - "3478:3478/tcp"
  #     - "49160-49179:49160-49179/udp"
  #   # and add to `command`:  --external-ip=${TURN_EXTERNAL_IP}
  #
  # WHAT PASSES THROUGH IT. Relayed drives carry the same audio the direct path
  # would, and only for the calls that could not find a direct one — the ICE
  # candidate pair still prefers a direct path when there is one. It runs on
  # this host, so no third party sees the audio, which is the same line
  # STT_PROVIDER and LANGFUSE_HOST are drawn on.
  coturn:
    image: coturn/coturn:4.7-alpine
    network_mode: host
    restart: unless-stopped
    # Flags rather than a mounted turnserver.conf, so there is one file to read
    # and nothing to keep in step with it.
    command:
      - --listening-port=3478
      - --realm=${TURN_REALM:-voicemural}
      - --fingerprint
      # The credential scheme. `--use-auth-secret` makes coturn accept a
      # username of `<expiry>:<label>` whose password is the HMAC-SHA1 of it
      # under this secret — so the browser can be handed a credential that is
      # useless tomorrow without the secret ever leaving the server. Minted by
      # packages/shared/src/turn-credentials.ts and, for the bot's own half, by
      # `turn_credentials` in apps/pipecat/bot.py. The two must agree byte for
      # byte; a mismatch shows up as a 401 here and silence on the drive.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      # The relay range, which must match whatever is published or opened on the
      # host firewall. One allocation per call and MAX_CONNECTIONS is 16 in
      # bot.py, so twenty ports is already generous.
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49179}
      # NOT AN OPEN PROXY. Without these an authenticated client can ask the
      # relay to send to anything this host can reach, which from inside the
      # datacentre includes the database, the internal Docker networks and the
      # cloud metadata endpoint. A TURN server is a packet forwarder that runs
      # on your network; these are the lines that keep it pointed outward.
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # Bounds what a leaked credential is worth. Generous for one voice call,
      # which is roughly 50 kbps each way.
      - --user-quota=12
      - --total-quota=100
      # TLS would need a certificate this container does not have — Traefik
      # holds the one for this domain. Plain 3478 over UDP and TCP is what the
      # browser and aiortc both use; `turns:` on 5349 is a later step and needs
      # a cert mount, not a flag.
      - --no-tls
      - --no-dtls
      # The CLI listens on 5766 with a default password. Nothing uses it.
      - --no-cli
      # Into the container log, where Coolify shows it, rather than a file
      # inside a container nobody will exec into.
      - --log-file=stdout
      - --simple-log

volumes:
  audio-data:
